# canmap.conf generated from current MaxxECU default CAN v1.3 CAN-Bus profile
# Copy /canmap.conf to SD card to replace the LittleFS copy at boot.
# SPEED: define physical CAN-Bus speed. Supported: 1, 5, 10, 12.5, 16, 20, 25, 50, 100, 125, 250, 500, 800 KBITS and 1MBITS. DEFAULT 500KBITS
# FILTER: optional hardware CAN filter. mask bits are ID bits that must match; this accepts standard IDs 0x500-0x5FF.
# ROLE: define which signals are tied  to specific roles like RPM, MAP, error counts, status messages, or alarm monitoring. 
# ROLE:alarmMonitor accepts up to 10 comma separated SIGNAL indexes monitored against alarmLimitMin/alarmLimit.
# SIGNAL: define the details of each CAN signal, including its ID, bit position, length, scaling, and name. 
# SIGNAL/INTERNAL: optional smoothingMs=0..60000 smooths display values only; missing or 0 disables it.
# Example: append ,smoothingMs=3000 for a fuel-level signal (3-second time constant).
# Raw alarms, VALUE/UNIT conditions, Telnet and ESP-NOW remain unchanged. Leave discrete signals unsmoothed.
# INTERNAL: maps built-in motion, microphone, or user GPIO/I2C inputs to ECU data indexes.
# source must be the first field after the INTERNAL index.
# Motion source values: accelX, accelY, accelZ, gyroX, gyroY, gyroZ.
# GPIO source: source=gpio,pin=<number>,mode=<digital|digital_pullup|digital_pulldown|analog_raw|analog_mv>,invert=<0|1>.
# LilyGo GPIO allowlist: 1,2,3,5,21,38,39,45,46,47. Up to six GPIO inputs can be configured.
# GPIO analog capability is not validated; selecting a suitable pin and protecting it electrically is the user's responsibility.
# I2C voltage source: source=I2C,device=INA226,address=<0x40..0x4F>,mode=<voltage|bus_voltage>.
# INA226 voltage is stored as integer millivolts; use scaling=1000 to display volts. LilyGo QWIIC uses SDA=7 and SCL=6.
# Motion example: INTERNAL:25,source=accelX,factor=100,offset=0,scaling=100,min=-8,max=8,alarmLimitMin=-8,alarmLimit=8,alarmSource=0,name=G|Accel X
# GPIO example: INTERNAL:65,source=gpio,pin=21,mode=digital_pullup,invert=1,factor=1,offset=0,scaling=1,min=0,max=1,alarmLimitMin=0,alarmLimit=1,alarmSource=0,name=|Input 1
# I2C example: INTERNAL:28,source=I2C,device=INA226,address=0x40,mode=voltage,factor=1,offset=0,scaling=1000,min=0,max=36,alarmLimitMin=0,alarmLimit=15,alarmSource=0,name=V|Supply Voltage
# Round Waveshare dual-microphone examples:
# INTERNAL:93,source=microphone,factor=1,offset=0,scaling=10,min=0,max=100,alarmLimitMin=0,alarmLimit=100,alarmSource=0,name=%|Sound Intensity
# INTERNAL:94,source=microphoneFrequency,factor=1,offset=0,scaling=1,min=0,max=10000,alarmLimitMin=0,alarmLimit=10000,alarmSource=0,name=Hz|Dominant Frequency
# VALUE and UNIT can override displayed value/unit text from raw signal conditions.
# Example: VALUE:57,raw=0,text=N
# Example: UNIT:57,raw=0,text=Neutral
# Optional link checks another SIGNAL's raw value: UNIT:57,raw>10,text=Balls Failure,link=1
# Custom error codes can be defined with the ERROR: directive
# ERROR:11,text=IAT sensor error
# ERROR:82,text=Custom ECU fault text
# ERROR:120,text=Another custom error|second line
# ALARM monitoring is done by comparing the signal value to alarmLimitMin and alarmLimit. Enable "Alarm Monitor" in Setup

SPEED:500KBITS
FILTER:id=0x500,mask=0x700,extended=0
ROLE:rpmIndex=0
ROLE:mapIndex=2
ROLE:errorCountIndex=51
ROLE:errorCodeIndex=82
ROLE:alarmMonitor=36
ROLE:dragModeTrigger=BIT:9


