# canmap_MEgasquirt.conf generated from MegaSquirt_CAN_Broadcast
# Profile: MegaSquirt simplified dash broadcast
# MegaSquirt simplified dash broadcast uses 11-bit CAN IDs, 500 kbit/s,
# sequential IDs, big-endian byte order, default base ID 1512 decimal / 0x5E8.
# Copy this file to /canmap.conf on  SD card OR edit directly using M-Gauge Web Configuration  to use it.
# NOTE: This maps the simplified dash broadcast set only. The advanced real-time
# dataset is much larger than the current M-Gauge ECU_DATA_COUNT table.
# SPEED: define physical CAN-Bus speed. Supported: 1, 5, 10, 12.5, 16, 20, 25, 50, 100, 125, 250, 500, 800 KBITS and 1MBITS. DEFAULT 500KBITS
# FILTER: optional hardware CAN filter. Mask bits are CAN ID bits that must match.
# ROLE: defines signals used for RPM, MAP, error handling, and alarm monitoring.
# ROLE:alarmMonitor accepts up to 10 comma-separated SIGNAL indexes monitored against alarmLimitMin/alarmLimit.
# SIGNAL: defines each CAN signal, including ID, bit position, length, scaling, limits, and name.
# INTERNAL: maps built-in motion sensors or user GPIO inputs to ECU data indexes.
# source must be the first field after the INTERNAL index.
# Motion source values: accelX, accelY, accelZ, gyroX, gyroY, gyroZ.
# GPIO source: source=gpio,pin=<number>,mode=<digital|digital_pullup|digital_pulldown|analog_raw|analog_mv>,invert=<0|1>.
# LilyGo GPIO allowlist: 1,2,3,5,21,38,39,45,46,47. Up to six GPIO inputs can be configured.
# GPIO analog capability is not validated; selecting a suitable pin and protecting it electrically is the user's responsibility.
# Motion example: INTERNAL:25,source=accelX,factor=100,offset=0,scaling=100,min=-8,max=8,alarmLimitMin=-8,alarmLimit=8,alarmSource=0,name=G|Accel X
# GPIO example: INTERNAL:65,source=gpio,pin=21,mode=digital_pullup,invert=1,factor=1,offset=0,scaling=1,min=0,max=1,alarmLimitMin=0,alarmLimit=1,alarmSource=0,name=|Input 1
# VALUE and UNIT can override displayed value/unit text from raw signal conditions.
# Example: VALUE:57,raw=0,text=N
# Example: UNIT:57,raw=0,text=Neutral
# Custom error codes can be defined with the ERROR: directive.
# ERROR:11,text=IAT sensor error
# ERROR:82,text=Custom ECU fault text
# ERROR:120,text=Another custom error|second line
# Alarm monitoring compares signal values with alarmLimitMin and alarmLimit. Enable "Alarm Monitor" in Setup.
SPEED:500KBITS
FILTER:id=0x5E8,mask=0x7F8,extended=0
ROLE:rpmIndex=1
ROLE:mapIndex=0
ROLE:alarmMonitor=

SIGNAL:0,id=0x5E8,startBit=0,bitLength=16,endian=big,signed=1,factor=1,offset=0,scaling=10,min=0,max=300,alarmLimitMin=0,alarmLimit=250,alarmSource=0,name=kPa|Manifold Pressure
SIGNAL:1,id=0x5E8,startBit=16,bitLength=16,endian=big,signed=0,factor=1,offset=0,scaling=1,min=0,max=10000,alarmLimitMin=0,alarmLimit=7000,alarmSource=0,name=RPM|Engine RPM
